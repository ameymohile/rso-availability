<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Availability · RSO Boston</title>
  <script>
    // Applied before first paint so switching themes never flashes.
    try {
      const saved = localStorage.getItem('theme');
      if (saved && saved !== 'auto') document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar">
      <div class="brand">
        <span class="brand-mark" id="eyebrow">RSO Boston</span>
        <h1 class="brand-title">Availability</h1>
      </div>

      <div class="topbar-right">
        <span class="pill" id="pill" hidden><i></i><span id="pillText"></span></span>

        <div class="seg" role="group" aria-label="Appearance">
          <button type="button" data-theme-set="auto" title="Match system" aria-label="Match system appearance">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg>
          </button>
          <button type="button" data-theme-set="light" title="Light" aria-label="Light appearance">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
          </button>
          <button type="button" data-theme-set="dark" title="Dark" aria-label="Dark appearance">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="grid">
      <!-- Left: the thing you came here to change. -->
      <section class="col-left">
        <div class="panel">
          <div class="panel-head">
            <h2>Your week</h2>
            <span class="note" id="subtitle">Loading&hellip;</span>
          </div>

          <div class="rows" id="days" aria-busy="true">
            <div class="row skeleton"><span></span></div>
            <div class="row skeleton"><span></span></div>
            <div class="row skeleton"><span></span></div>
            <div class="row skeleton"><span></span></div>
            <div class="row skeleton"><span></span></div>
            <div class="row skeleton"><span></span></div>
            <div class="row skeleton"><span></span></div>
          </div>

          <div class="panel-foot">
            <button class="save" id="save" type="button" disabled>Saved</button>
            <p class="status" id="status" role="status" aria-live="polite"></p>
          </div>
        </div>

        <div class="panel" id="history" hidden>
          <div class="panel-head">
            <h2>Recent changes</h2>
          </div>
          <ul class="log" id="log"></ul>
        </div>
      </section>

      <!-- Right: what is happening, in priority order. -->
      <section class="col-right">
        <div class="panel" id="open">
          <div class="panel-head">
            <h2>Open shifts</h2>
            <span class="head-actions">
              <span class="note mono" id="openChecked"></span>
              <button class="icon-btn" id="refresh" type="button" title="Check now (R)" aria-label="Check for open shifts now">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 11a8 8 0 1 0-.6 4"/><path d="M20 4.5V11h-6.2"/>
                </svg>
              </button>
            </span>
          </div>
          <div id="openBody"></div>
        </div>

        <div class="panel" id="shifts" hidden>
          <div class="panel-head">
            <h2>Upcoming shifts</h2>
            <span class="note mono" id="shiftsSummary"></span>
          </div>

          <div class="split">
            <div class="cal-wrap">
              <p class="cal-month mono" id="calMonth"></p>
              <div class="cal" id="cal" role="grid" aria-label="Upcoming shifts calendar"></div>
            </div>
            <ul class="agenda" id="agenda"></ul>
          </div>
        </div>
      </section>
    </div>

    <footer class="hints">
      <span><kbd>⌘</kbd><kbd>S</kbd> save</span>
      <span><kbd>R</kbd> refresh board</span>
    </footer>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
